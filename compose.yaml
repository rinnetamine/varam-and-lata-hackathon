services:
  api:
    build: ./server
    volumes:
      - people-data:/data
      - ./public/data/addresses.json:/app/addresses.json:ro
    environment:
      ADDRESS_FILE: /app/addresses.json
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  people-data:
